services:
  bookclub:
    image: ghcr.io/nickwolf/bookclub:${BOOKCLUB_IMAGE_TAG:-latest}
    container_name: bookclub
    environment:
      - TZ=${TZ}
      - HARDCOVER_TOKEN=${HARDCOVER_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - ABS_URL=${ABS_URL}
      - ABS_TOKEN=${ABS_TOKEN}
      - ABS_PLAYLIST_ID=${ABS_PLAYLIST_ID}
    volumes:
      # Named volume for the app database
      - bookclub_data:/data
      # ABS config mounted read-only for library cross-reference
      - audiobookshelf_config:/abs_config:ro
    ports:
      - "${BOOKCLUB_PORT}:8080"
    restart: unless-stopped
    labels:
      # Watchtower users get new releases automatically; set BOOKCLUB_IMAGE_TAG=0.2 in .env to stay on a minor line
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  # App database. Create before first run: docker volume create bookclub_data
  # Marked external so it's never deleted by `docker compose down -v`.
  bookclub_data:
    external: true

  # Audiobookshelf's own config volume, mounted read-only for the library cross-reference.
  # Must be external: without it compose creates an empty bookclub_audiobookshelf_config instead.
  # If you don't run ABS in Docker, create an empty volume with this name; the app degrades gracefully.
  audiobookshelf_config:
    external: true
